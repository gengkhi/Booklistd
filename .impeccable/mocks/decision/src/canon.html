*{box-sizing:border-box;margin:0;padding:0}
body{width:390px;height:844px;overflow:hidden;background:#fff;font-family:-apple-system,"SF Pro Text","Segoe UI",Roboto,sans-serif;color:#111;position:relative}
.status{height:47px;display:flex;justify-content:space-between;align-items:center;padding:0 28px;font-weight:600;font-size:15px}
.bar{display:flex;justify-content:flex-end;padding:4px 16px;color:#0A84FF;font-size:17px;gap:20px}
h1{font-size:34px;font-weight:700;padding:2px 16px 0;letter-spacing:.2px}
.search{margin:10px 16px;height:36px;border-radius:10px;background:#EFEFF4;color:#8E8E93;display:flex;align-items:center;padding:0 10px;font-size:16px}
.seg{margin:4px 16px 12px;height:32px;border-radius:9px;background:#EFEFF4;display:flex;padding:2px}
.seg div{flex:1;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600;border-radius:7px}
.seg .on{background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.12)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px 12px;padding:0 16px}
.c{aspect-ratio:2/3;border-radius:4px;display:flex;align-items:flex-end;padding:8px;color:#fff;font-weight:700;font-size:11px;box-shadow:0 2px 6px rgba(0,0,0,.15)}
.t{font-size:12px;font-weight:600;margin-top:5px}.a{font-size:11px;color:#8E8E93}
.tabs{position:absolute;left:0;right:0;bottom:0;height:84px;background:rgba(249,249,249,.96);border-top:.5px solid #ccc;display:flex;justify-content:space-around;padding-top:8px}
.tab{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10px;color:#8E8E93;width:60px}
.tab.on{color:#0A84FF}
