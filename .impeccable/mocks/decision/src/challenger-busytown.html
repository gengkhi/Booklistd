<!doctype html>
<html><head><meta charset="utf-8"><title>Busytown Cutaway</title>
<link href="https://fonts.googleapis.com/css2?family=Grandstander:wght@800&family=Figtree:wght@500;600;700;800&display=block" rel="stylesheet">
<style>
:root{--white:#FFFFFF;--red:#B83A2B;--yel:#F2C12E;--grn:#4F9A4A;--brn:#5A3A22;--sky:#DDEFF6}
*{box-sizing:border-box;margin:0;padding:0}
body{width:390px;height:844px;overflow:hidden;background:var(--white);font-family:Figtree,sans-serif;color:var(--brn);position:relative}
.status{height:47px;display:flex;justify-content:space-between;align-items:center;padding:0 28px;font-weight:700;font-size:15px}
h1{font-family:Grandstander;font-weight:800;font-size:34px;padding:2px 20px 0;color:var(--red)}
.sub{padding:0 20px;font-size:13px;font-weight:600}
svg.scene{display:block;margin:10px auto 0}
.lbl{font-family:Figtree;font-size:10.5px;font-weight:700;fill:#5A3A22}
.tabs{position:absolute;left:0;right:0;bottom:0;height:86px;background:#fff;border-top:2px solid var(--brn);display:flex;justify-content:space-around;padding-top:10px}
.tab{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;font-weight:800;width:60px;color:#8a6d55}
.tab.on{color:var(--red)}
.scan{width:60px;height:60px;border-radius:50%;background:var(--yel);border:2px solid var(--brn);margin-top:-28px;display:flex;align-items:center;justify-content:center}
.hint{position:absolute;left:20px;right:20px;bottom:100px;background:var(--sky);border:2px solid var(--brn);border-radius:12px;padding:10px 12px;font-size:12.5px;font-weight:700}
</style></head><body>

</body></html>
