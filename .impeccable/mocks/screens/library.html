<!doctype html>
<html><head><meta charset="utf-8"><title>Library</title>
<link rel="stylesheet" href="shared.css"><script src="shared.js"></script>
<style>
.head{padding:4px 20px 0;position:relative}
.greet{font-weight:700;font-size:14px}
h1{font-size:40px}
.sub{font-size:13px;font-weight:700;margin-top:2px}
.sp{cursor:pointer;transition:transform 180ms var(--ease-out)}
.sp:hover{transform:translateY(-8px)}
.tip{animation:tip 900ms var(--ease-out)}
@keyframes tip{0%{transform:rotate(12deg)}30%{transform:rotate(22deg)}55%{transform:rotate(8deg)}75%{transform:rotate(14deg)}100%{transform:rotate(12deg)}}
.dewey{cursor:pointer}
.blink{animation:blink 5.5s infinite}
@keyframes blink{0%,96%,100%{transform:scaleY(1)}98%{transform:scaleY(.1)}}
.lampsvg{position:absolute;right:-2px;top:-4px;z-index:1;pointer-events:none}
.zzz{position:absolute;font-family:'Bagel Fat One';color:#F4B41A;font-size:16px;animation:z 2.6s infinite;z-index:6}
@keyframes z{0%{opacity:0;transform:translate(0,0)}30%{opacity:1}100%{opacity:0;transform:translate(14px,-26px)}}
</style></head>
<body>
<script>
const LAMP = new URLSearchParams(location.search).has('lamp');
if (LAMP) document.body.classList.add('lamp');
document.write(status());
document.write(`<div class="head">
  <div class="greet soft">${LAMP?'Still up, Sean?':'Good evening, Sean'}</div>
  <h1 class="display">My Library</h1>
  <div class="sub soft">${LAMP?'412 books · lamp on · 3 visiting friends':'412 books on 3 shelves · 3 visiting friends'}</div>
</div>`);
const shelves = [
  {room:'Living room · 146', note:'the respectable ones', noteX:170, plank:'b',
   books:[['DUNE','p',30,112],['PIRANESI','b',26,120,{band:1}],['MIDDLEMARCH','t',34,104],['','g',18,116,{dots:1}],['THE HOBBIT','w',28,108,{band:1}],['','m',16,96]],
   tail:()=>stack([['EMMA','c',70],['BELOVED','g',78],['STONER','t',64]])+spine(['THE WAVES','k',24,114,{lean:-12,cls:'leaner'}])},
  {room:'Bedroom · 88', note:'3× Dune, no regrets', noteX:140, plank:'t', dewey:true,
   books:[['STONER','g',28,110],['DUNE','w',30,116,{band:1}],['DUNE','p',30,118],['DUNE','b',30,112,{band:1}],['','t',16,98,{dots:1}],['JANE EYRE','m',26,106,{lean:-10}]]},
  {room:'Study · 94', note:'bought with good intentions', noteX:128, plank:'p',
   books:[['ULYSSES','k',36,120,{band:1}],['','b',18,100,{dots:1}],['WAR & PEACE','t',40,122],['SAPIENS','w',28,106],['','g',16,92],['BLEAK HOUSE','c',30,112,{band:1}],['ORLANDO','p',24,104]]},
];
let html = '<div class="case">';
shelves.forEach(s=>{
  html += `<div class="shelf">`;
  if (LAMP && s.dewey) html += `<svg class="lampsvg" width="120" height="150" viewBox="0 0 120 150"><defs><pattern id="ht" width="6" height="6" patternUnits="userSpaceOnUse"><circle cx="3" cy="3" r="1.4" fill="#F4B41A"/></pattern></defs><path d="M60 0v14" stroke="#120B06" stroke-width="3"/><path d="M42 30 L60 14 L78 30Z" fill="#F4B41A" stroke="#120B06" stroke-width="2.5"/><path d="M42 30 L-30 150 H150 L78 30Z" fill="url(#ht)" opacity=".55"/></svg>`;
  html += `<div class="row">${s.books.map(spine).join('')}${s.tail?s.tail():''}</div>`;
  html += `<div class="plank" style="background:${INK[s.plank]}"></div>`;
  html += `<div class="roomtag">${s.room}</div><div class="tapenote" style="left:${s.noteX}px">${s.note}</div>`;
  if (s.dewey){
    html += `<div id="dw" style="position:absolute;right:18px;bottom:16px;z-index:5">${dewey(LAMP?'sleep':'happy')}</div>`;
    html += LAMP
      ? `<div class="zzz" style="right:30px;top:60px">z</div><div class="zzz" style="right:20px;top:52px;animation-delay:1.2s">z</div>`
      : `<div class="bubble" id="bub" style="right:12px;top:30px;width:136px">Three copies of Dune. I'm not judging. <b style="color:#E2462B">(I am.)</b></div>`;
  }
  html += `</div>`;
});
html += '</div>';
document.write(html);
document.write(tabs('Shelves'));

// interactions: tap the leaning book, tap Dewey for a new line
const lines = ['Three copies of Dune. I\'m not judging. <b style="color:#E2462B">(I am.)</b>',
  'Middlemarch has been "almost finished" since spring.',
  '146 books in the living room. Guests are impressed. Or scared.',
  'Jane Eyre is leaning. She\'s been through a lot.'];
let li = 0;
document.getElementById('dw').onclick = () => { const b=document.getElementById('bub'); if(!b) return; li=(li+1)%lines.length; b.innerHTML=lines[li]; b.animate([{transform:'scale(.85)',opacity:0},{transform:'scale(1)',opacity:1}],{duration:260,easing:'cubic-bezier(.16,1,.3,1)'}); };
const leaner = document.querySelector('.leaner');
leaner.onclick = () => { leaner.classList.remove('tip'); void leaner.offsetWidth; leaner.classList.add('tip'); };
</script>
</body></html>
