<!doctype html>
<html><head><meta charset="utf-8"><title>Search</title>
<link rel="stylesheet" href="shared.css"><script src="shared.js"></script>
<style>
.head{padding:4px 20px 0}
h1{font-size:36px}
.field{margin:12px 16px 0;height:54px;background:#fff;border:2.5px solid var(--ink);border-radius:14px;display:flex;align-items:center;gap:10px;padding:0 14px;font-weight:800;font-size:16px;box-shadow:3px 3px 0 var(--ink)}
.caret{width:2px;height:22px;background:var(--ink);animation:c 1s steps(1) infinite}
@keyframes c{50%{opacity:0}}
.quip{margin:10px 20px 0;font-family:'Gochi Hand';font-size:16px;color:var(--soft)}
.sec{display:flex;align-items:center;gap:8px;margin:18px 20px 8px;font-weight:900;font-size:13px}
.sec:before{content:"";width:18px;height:2px;background:var(--ink)}
.sec em{font-style:normal;color:var(--soft);font-weight:700}
.item{display:flex;align-items:center;gap:12px;margin:0 16px 10px;background:#fff;border:2px solid var(--ink);border-radius:12px;padding:10px 12px}
.item h4{font-size:15px;font-weight:900}
.item p{font-size:12.5px;font-weight:700;color:var(--soft);margin-top:2px}
.item .where{margin-left:auto;text-align:right;font-size:11.5px;font-weight:900}
.add{margin-left:auto;height:36px;padding:0 14px;border:2px solid var(--ink);border-radius:10px;background:var(--bus);font-weight:900;font-size:13px;display:flex;align-items:center;box-shadow:2px 2px 0 var(--ink)}
.item .sp{margin:0}
</style></head>
<body>
<script>
document.write(status());
document.write(`<div class="head"><h1 class="display">Search</h1></div>
<div class="field"><svg width="22" height="22" fill="none" stroke="#2B1D14" stroke-width="2.6"><circle cx="10" cy="10" r="6"/><path d="M15 15l5 5"/></svg>dune<div class="caret"></div></div>
<div class="quip">Searching "dune". Again. Dewey has notes.</div>
<div class="sec">On your shelves <em>· 3</em></div>`);
[['Dune','Frank Herbert · Ace, 1990','Living room','p'],['Dune','Frank Herbert · Chilton, 1965','Bedroom','w'],['Dune','Frank Herbert · Penguin, 2015','Visiting Maya','b']].forEach(([t,a,w,c])=>{
  document.write(`<div class="item">${spine(['',c,14,48,{band:c!=='p'}])}<div><h4>${t}</h4><p>${a}</p></div><div class="where">${w}</div></div>`);
});
document.write(`<div class="sec">From the catalog <em>· 12</em></div>`);
[['Dune Messiah','Frank Herbert · 1969','t'],['Children of Dune','Frank Herbert · 1976','g'],['The Dune Encyclopedia','Willis McNelly · 1984','m']].forEach(([t,a,c])=>{
  document.write(`<div class="item">${spine(['',c,14,48,{dots:c==='g'}])}<div><h4>${t}</h4><p>${a}</p></div><div class="add">+ Add</div></div>`);
});
document.write(tabs('Search'));
</script>
</body></html>
