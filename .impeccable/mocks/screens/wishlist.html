<!doctype html>
<html><head><meta charset="utf-8"><title>Wishlist</title>
<link rel="stylesheet" href="shared.css"><script src="shared.js"></script>
<style>
.head{padding:4px 20px 0}
h1{font-size:36px}
.sub{font-size:13px;font-weight:700;margin-top:2px}
.case{margin-top:12px}
.row{height:140px;padding-top:34px}
.slip{margin:0 16px 10px;display:flex;gap:12px;align-items:center;background:#fff;border:2px solid var(--ink);border-radius:10px;padding:10px 12px;position:relative}
.slip h4{font-size:15px;font-weight:900}
.slip p{font-size:12.5px;font-weight:700;color:var(--soft);margin-top:2px}
.due{display:inline-block;margin-top:5px;border:2px solid var(--plum);color:var(--plum);font-weight:900;font-size:10px;padding:1px 6px;border-radius:3px;transform:rotate(-3deg)}
.found{margin-left:auto;height:36px;padding:0 12px;border:2px solid var(--ink);border-radius:10px;background:var(--bus);font-weight:900;font-size:12.5px;display:flex;align-items:center;box-shadow:2px 2px 0 var(--ink);white-space:nowrap}
.sec{display:flex;align-items:center;gap:8px;margin:18px 20px 8px;font-weight:900;font-size:13px}
.sec:before{content:"";width:18px;height:2px;background:var(--ink)}
</style></head>
<body>
<script>
document.write(status());
document.write(`<div class="head"><h1 class="display">Wishlist</h1><div class="sub soft">27 books you'll "definitely" read</div></div>`);
document.write(`<div class="case"><div class="shelf"><div class="row">${[
 ['REMAINS','t',28,104],['','g',18,96,{dots:1}],['MIDNIGHT LIBRARY','p',30,110,{band:1}],['','b',16,92],['KLARA','w',26,100,{band:1}],['','m',18,106],['','t',14,88,{dots:1}],['LONESOME DOVE','k',34,108]
].map(spine).join('')}</div><div class="plank" style="background:var(--plum)"></div>
<div class="roomtag">The Someday shelf · 27</div>
<div style="position:absolute;right:14px;bottom:16px;z-index:5">${dewey('smug',56)}</div>
<div class="bubble" style="right:14px;top:-26px;width:150px">At this rate it needs its own room.</div></div></div>`);
document.write(`<div class="sec">Wanted the longest</div>`);
[['Lonesome Dove','Larry McMurtry','WANTED SINCE 2022','k'],['The Midnight Library','Matt Haig','WANTED SINCE MAR','p'],['Klara and the Sun','Kazuo Ishiguro','WANTED SINCE JUN','w']].forEach(([t,a,d,c])=>{
  document.write(`<div class="slip">${spine(['',c,14,48,{band:c==='w'}])}<div><h4>${t}</h4><p>${a}</p><div class="due">${d}</div></div><div class="found">Found it!</div></div>`);
});
document.write(tabs('Wishlist'));
</script>
</body></html>
